[project]
name = "going-bananas-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "garmin-connect-personal-api-python>=1,<2",
  "garmin-fit-sdk==21.221.0",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.31,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.13,<2"]
[tool.ruff]
line-length = 120

[[tool.mypy.overrides]]
module = "app.api.responses"
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs a migrated PostgreSQL test database (auto-applied by tests/conftest.py)"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
exclude = ["migrations/**"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]
"app/coach_v2_models.py" = ["E501"]
"app/exception_models.py" = ["E501"]
"app/planning_models.py" = ["E501"]
"app/services/exceptions/detector.py" = ["E501"]
"tests/integration/test_schema_upgrade.py" = ["E501"]
"tests/unit/test_exception_prompts.py" = ["E501"]
