services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: garmin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in protected .env}
      POSTGRES_DB: garmin_demo
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garmin -d garmin_demo"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
